<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northstar Supply — Checkout</title>
  <style>
    :root { color-scheme: light; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1c2935; background: #ffffff; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; }
    .brand { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .14em; color: #637178; }
    h1 { margin: 12px 0 6px; font-size: 24px; letter-spacing: -.8px; }
    .intro { color: #67737b; font-size: 13px; margin: 0 0 24px; }
    .line { display: flex; justify-content: space-between; gap: 16px; margin: 14px 0; font-size: 14px; }
    .line span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .detail { font-size: 12px; color: #67737b; margin: -7px 0 16px; }
    .total { border-top: 1px solid #e5e9e8; padding-top: 19px; margin-top: 20px; font-size: 20px; font-weight: 750; }
    .note { padding: 12px; background: #f2f6f5; border-radius: 9px; color: #57675f; font-size: 11px; line-height: 1.5; margin-top: 24px; }
    /* Agent changes may add a savings row and a promotion-status callout. */
    @media (max-height: 380px) {
      body { padding: 16px 20px; }
      h1 { font-size: 21px; margin-top: 9px; }
      .intro { margin-bottom: 15px; font-size: 12px; }
      .line { margin: 10px 0; font-size: 13px; }
      .detail { margin-top: -4px; margin-bottom: 11px; font-size: 11px; }
      .total { padding-top: 13px; margin-top: 14px; font-size: 19px; }
      .note { margin-top: 15px; padding: 9px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <div class="brand">✦ Northstar Supply</div>
  <h1>Your order summary</h1>
  <p class="intro">Good things, thoughtfully chosen.</p>
  <div class="line"><span>Subtotal</span><span id="subtotal">—</span></div>
  <!-- AGENT_PROMOTION_DETAILS -->
  <!-- END_AGENT_PROMOTION_DETAILS -->
  <div class="line"><span>Delivery</span><span id="shipping">—</span></div>
  <p class="detail" id="shipping-label">—</p>
  <div class="line total"><span>Total</span><span id="total">—</span></div>
  <p class="note">Demo checkout · No payment or personal details are collected.</p>
  <script>
    "use strict";
    const money = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
    const currency = (value) => Number.isFinite(value) ? money.format(value / 100) : "—";
    window.addEventListener("message", (event) => {
      if (event.source !== window.parent || !event.data || event.data.type !== "quote") return;
      const quote = event.data.quote;
      if (!quote || typeof quote !== "object") return;
      document.getElementById("subtotal").textContent = currency(quote.subtotal_cents);
      document.getElementById("shipping").textContent = currency(quote.shipping_cents);
      document.getElementById("total").textContent = currency(quote.total_cents);
      document.getElementById("shipping-label").textContent = String(quote.shipping_label || "Delivery");
      // AGENT_PROMOTION_RENDER
      // END_AGENT_PROMOTION_RENDER
    });
  </script>
</body>
</html>
